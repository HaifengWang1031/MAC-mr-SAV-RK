[project]
name = "mac-mr-sav-rk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.59", "h5py>=3.8", "matplotlib>=3.7", "sympy>=1.12"]

[dependency-groups]
dev = ["pytest>=7", "mypy>=1.10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["solver", "experiments", "tools"]
