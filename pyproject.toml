[project]
name = "mac-mr-sav-rk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "sympy>=1.12",
    "scikit-fem>=12.0.2,<13",
    "pymetis==2025.2.2",
]

[project.optional-dependencies]
pardiso = [
    "pypardiso==0.4.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mkl==2026.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
mesh = [
    "gmsh==4.15.2",
]
multigrid = [
    "petsc4py==3.25.5",
]

[dependency-groups]
dev = ["pytest>=7", "mypy>=1.10", "threadpoolctl>=3"]
notebook = ["ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["solver", "run_support", "postprocess", "experiments", "tools", "tests/references", "tests/core_distribution.py"]
